<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI智简历 - 简历编辑器</title>
<link rel="stylesheet" href="/static/resume-render.css?v=20261005e">
<link rel="stylesheet" href="/static/editor-v3.css?v=20261005n">
</head>
<body>

<!-- ─── 顶栏 ─── -->
<header class="v3-topbar">
  <div class="v3-tb-left">
    <a href="/" class="v3-logo" title="返回首页">
      <svg class="v3-logo-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="9" fill="#34549B"/>
        <path d="M20 7.5l4.2 8.5 9.4 1.4-6.8 6.6 1.6 9.3L20 28.2l-8.4 4.4 1.6-9.3-6.8-6.6 9.4-1.4z" fill="#FAF9F6"/>
      </svg>
      <span class="v3-logo-name">AI智简历<small>简历编辑器</small></span>
    </a>
    <a href="/my-resumes" class="v3-tb-back">← 我的简历</a>
    <span class="v3-saved" id="savedTip">…</span>
  </div>

  <div class="v3-tb-right">
    <button class="v3-btn v3-btn-soft" id="tplBtn" title="更换版式与配色（内容不丢失）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>更换模板</span>
    </button>
    <button class="v3-btn v3-btn-primary" id="saveBtn" title="保存到云端">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
      <span>保存</span>
    </button>
    <div class="v3-dropdown">
      <button class="v3-btn v3-btn-dark" id="downloadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></svg>
        <span>下载</span><span class="v3-caret">▾</span>
      </button>
      <div class="v3-dropdown-menu" id="downloadMenu" hidden>
        <button data-fmt="docx">Word 文档（.docx）</button>
        <button data-fmt="pdf">PDF 文档（.pdf）</button>
        <button data-fmt="png">长图（.png）</button>
      </div>
    </div>
    <div class="v3-avatar" id="userAvatar" title="已登录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
    </div>
  </div>
</header>

<!-- ─── 三栏主体 ─── -->
<main class="v3-main">
  <!-- 左：内容表单 -->
  <aside class="v3-left">
    <div class="v3-left-head">内容<div class="v3-left-tip">所有修改实时同步到右侧简历</div></div>
    <div class="v3-left-body" id="leftBody"></div>
  </aside>

  <!-- 中：A4 所见即所得 -->
  <section class="v3-center" id="centerWrap">
    <div class="v3-pagebox" id="pageBox">
      <div class="rp-paper rr-host" id="paper"></div>
    </div>
    <div class="v3-pagehint" id="pageHint"></div>
  </section>

  <!-- 右：设计面板 -->
  <aside class="v3-right">
    <div class="v3-right-head">设计</div>
    <div class="v3-right-body">

      <div class="v3-group">
        <div class="v3-group-title">版式</div>
        <div class="v3-fam-grid" id="famGrid"></div>
      </div>

      <div class="v3-group">
        <div class="v3-group-title">主色</div>
        <div class="v3-swatches" id="swatches"></div>
        <div class="v3-color-row">
          <input type="color" id="customColor" value="#34549B">
          <span>自定义主色</span>
        </div>
      </div>

      <div class="v3-group">
        <div class="v3-group-title">字体</div>
        <select class="v3-select" id="fontSel"></select>
        <div class="v3-slider-row"><span>字号</span><input type="range" id="fontSize" min="11" max="16" step="0.5"><b id="fontSizeVal"></b></div>
        <div class="v3-slider-row"><span>行距</span><input type="range" id="lineHeight" min="1.4" max="2.1" step="0.02"><b id="lineHeightVal"></b></div>
        <div class="v3-slider-row"><span>姓名</span><input type="range" id="nameSize" min="20" max="40" step="1"><b id="nameSizeVal"></b></div>
      </div>

      <div class="v3-group">
        <div class="v3-group-title">间距</div>
        <div class="v3-slider-row"><span>模块间距</span><input type="range" id="gap" min="10" max="44" step="1"><b id="gapVal"></b></div>
        <div class="v3-slider-row"><span>版心留白</span><input type="range" id="padding" min="26" max="72" step="1"><b id="paddingVal"></b></div>
        <div class="v3-slider-row"><span>标题样式</span>
          <select class="v3-select v3-select-inline" id="sectionStyle">
            <option value="underline">下划线</option>
            <option value="leftbar">左侧色条</option>
            <option value="bar">色块</option>
            <option value="plain">无装饰</option>
          </select>
        </div>
      </div>

      <div class="v3-group">
        <div class="v3-group-title">头像</div>
        <div class="v3-photo-row">
          <div class="v3-photo-prev" id="photoPrev"><span id="photoPrevTxt">无照片</span><img id="photoPrevImg" alt="" hidden></div>
          <div class="v3-photo-ops">
            <label class="v3-btn v3-btn-soft v3-btn-sm">上传照片<input type="file" id="photoInput" accept="image/*" hidden></label>
            <label class="v3-chk"><input type="checkbox" id="showPhoto">显示头像框</label>
            <div class="v3-shape-row" id="shapeRow">
              <button data-shape="rect" class="v3-shape-btn">方框</button>
              <button data-shape="circle" class="v3-shape-btn">圆框</button>
            </div>
            <div class="v3-slider-row"><span>大小</span><input type="range" id="photoSize" min="64" max="130" step="1"><b id="photoSizeVal"></b></div>
          </div>
        </div>
      </div>

    </div>
  </aside>
</main>

<!-- ─── 更换模板弹窗 ─── -->
<div class="v3-mask" id="tplModal" hidden>
  <div class="v3-modal">
    <div class="v3-modal-head">
      <h3>更换模板</h3>
      <button class="v3-modal-close" data-close-tpl>&times;</button>
    </div>
    <p class="v3-modal-tip">更换版式与配色<b>不会丢失任何内容</b>；之后也可在右侧设计面板继续微调。</p>
    <div class="v3-tpl-grid" id="tplGrid"></div>
  </div>
</div>

<!-- ─── loading / toast ─── -->
<div class="v3-loading" id="loadingMask" hidden>
  <div class="v3-loading-card"><div class="v3-spinner"></div><p id="loadingText">处理中…</p></div>
</div>
<div class="v3-toast" id="toast" hidden></div>

<script src="/static/resume-render.js?v=20261005d"></script>
<script src="/static/editor-v3.js?v=20261005p"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模板管理 - 简历优化系统</title>
<link rel="stylesheet" href="/static/css/app.css?v=20261004c">
<style>
  /* 管理后台 · 与前台同一设计语言 */
  body { padding: 32px 16px; }
  .container { width: 100%; max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; }
  .subtitle { color: var(--ink-3); font-size: 13px; margin-bottom: 20px; }
  .back-link { font-size: 13px; color: var(--ink-3); text-decoration: none; }
  .back-link:hover { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-paper); padding: 24px; margin-bottom: 20px; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--ink); }
  .alert { border-radius: var(--r-md); }
  label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=password], textarea { width: 100%; }
  .form-row { margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn { padding: 10px 26px; }
  /* 内联实色背景的按钮强制白字（原渐变按钮的替代写法） */
  .btn[style*="--accent"], .btn[style*="--success"], .btn[style*="--vip"] { color: #fff; border-color: transparent; }
  .btn-mini { padding: 4px 12px; font-size: 12px; }
  /* 模板列表 */
  th, td { font-size: 13px; }
  .tbl-wrap { overflow: auto; }
  .tpl-mods { display: flex; flex-wrap: wrap; gap: 4px; }
  .mod-tag { font-size: 11px; background: var(--paper-deep); color: var(--ink-2); border-radius: 4px; padding: 1px 6px; }
  .empty { color: var(--ink-3); text-align: center; padding: 24px; font-size: 13px; }
  .ops { display: flex; gap: 6px; }
  .ev { font-weight: 600; color: var(--accent); white-space: nowrap; }
  .err { color: var(--danger); font-weight: 600; }
  .detail { color: var(--ink-2); word-break: break-all; font-size: 12px; }
  .login-box { max-width: 360px; margin: 0 auto; padding: 12px 0; }
  .pwd-row { display: flex; gap: 10px; align-items: center; }
  .pwd-row input { flex: 1; }
  .lock-note { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
    <div>
      <h1>管理后台</h1>
      <p class="subtitle">上传简历模板（.docx），可视化编辑模板布局，管理模板库</p>
    </div>
    <div style="display:flex;gap:8px;flex:none;align-items:center">
      <a class="back-link" href="/" style="float:none">← 返回首页</a>
      <button class="btn btn-mini" id="logoutBtn" style="display:none">退出登录</button>
    </div>
  </div>

  <div class="alert" id="alert"></div>
  <div class="alert ok" id="okAlert"></div>

  <!-- 上传模板 -->
  <div class="card" id="uploadCard" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div style="width:38px;height:38px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 20h16"/></svg></div>
      <span style="font-size:17px;font-weight:700;color:var(--ink)">上传新模板</span>
    </div>
    <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:14px">支持 .docx，可多选批量导入</div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
      <div style="flex:1;border:1px solid var(--line-strong);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink-2);background:var(--paper-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="filePathBox">未选择文件</div>
      <button class="btn" id="pickFileBtn" style="padding:9px 18px;border-radius:8px">选择文件</button>
      <input type="file" id="tplFile" accept=".docx" multiple hidden>
      <div id="fileCount" style="font-size:12px;color:var(--ink-3)"></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn" id="uploadBtn" style="background:var(--accent);border-radius:8px;padding:11px 26px">上传所选模板</button>
      <button class="btn" id="batchUploadBtn" style="background:var(--success);border-radius:8px;padding:11px 26px">批量导入全部所选</button>
    </div>
  </div>

  <!-- 模板列表 -->
  <div class="card" id="listCard" style="display:none">
    <div class="card-title">免费模板</div>
    <div id="tplList"></div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const MODULE_KEYS = ["summary", "work_experience", "projects", "education", "skills"];
const MODULE_LABELS = {
  summary: "个人优势", work_experience: "工作经历", projects: "项目经历",
  education: "教育背景", skills: "专业技能",
};
let adminToken = sessionStorage.getItem("resume_admin_token") || "";
let activePage = 1;
const ACTIVE_PAGE_SIZE = 10;

const AUTH_HEADER = function() { return { "Authorization": "Bearer " + adminToken }; };

// 未登录/令牌失效：跳转管理员登录页
function requireAdminLogin() {
  sessionStorage.removeItem("resume_admin_token");
  location.href = "/admin/login";
}

// 统一请求：自动附带令牌，401/403 时跳转登录页
async function adminFetch(url, options) {
  const opts = Object.assign({}, options || {});
  const headers = Object.assign({}, opts.headers || {}, AUTH_HEADER());
  opts.headers = headers;
  const resp = await fetch(url, opts);
  if (resp.status === 401 || resp.status === 403) {
    requireAdminLogin();
    throw new Error("登录已过期，请重新登录");
  }
  return resp;
}

function showAlert(msg) { const a = $("alert"); a.textContent = msg; a.classList.add("show"); }
function hideAlert() { $("alert").classList.remove("show"); }
function showOk(msg) { const a = $("okAlert"); a.textContent = msg; a.classList.add("show"); setTimeout(() => a.classList.remove("show"), 3000); }

function enterAdmin() {
  $("logoutBtn").style.display = "inline-block";
  $("uploadCard").style.display = "block";
  $("listCard").style.display = "block";
  loadTemplates();
}

$("logoutBtn").addEventListener("click", async () => {
  try {
    await fetch("/api/admin/logout", { method: "POST", headers: AUTH_HEADER() });
  } catch (e) {}
  requireAdminLogin();
});

// ── 上传模板 ──
$("pickFileBtn").addEventListener("click", function() { $("tplFile").click(); });
$("tplFile").addEventListener("change", function() {
  const n = this.files.length;
  if (n) {
    const names = Array.from(this.files).map(function(f) { return f.name; }).join("、");
    $("filePathBox").textContent = names.length > 50 ? names.slice(0, 50) + "…" : names;
    $("fileCount").textContent = "已选 " + n + " 个";
  } else {
    $("filePathBox").textContent = "未选择文件";
    $("fileCount").textContent = "";
  }
});

$("uploadBtn").addEventListener("click", async () => {
  hideAlert();
  const files = $("tplFile").files;
  if (!files.length) { showAlert("请选择 .docx 模板文件"); return; }
  // 多选时直接走批量导入，避免只上传第一个文件
  if (files.length > 1) { $("batchUploadBtn").click(); return; }
  const file = files[0];

  const fd = new FormData();
  fd.append("name", "");  // 留空：系统自动识别模板名称
  fd.append("description", "");  // 留空：系统自动识别模板描述
  fd.append("modules", "");  // 留空：系统自动识别模块配置
  fd.append("file", file);

  const btn = $("uploadBtn");
  btn.disabled = true;
  try {
    const resp = await adminFetch("/admin/templates/upload", { method: "POST", body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.error || "上传失败");
    showOk("模板「" + (data.name || "未命名") + "」已接收，等待人工审核");
    $("tplFile").value = "";
    $("filePathBox").textContent = "未选择文件";
    $("fileCount").textContent = "";
    activePage = 1;
    loadTemplates();
  } catch (e) {
    showAlert("上传失败：" + e.message);
  } finally {
    btn.disabled = false;
  }
});

// ── 批量导入 ──
$("batchUploadBtn").addEventListener("click", async () => {
  hideAlert();
  const files = $("tplFile").files;
  if (!files.length) { showAlert("请先选择模板文件（可多选）"); return; }
  if (files.length === 1) { $("uploadBtn").click(); return; }
  const btn = $("batchUploadBtn");
  btn.disabled = true;
  btn.textContent = "正在批量导入…";
  try {
    const fd = new FormData();
    for (const f of files) fd.append("files", f);
    const resp = await adminFetch("/admin/templates/batch_upload", { method: "POST", body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.error || "批量导入失败");
    const failed = (data.results || []).filter(function(r) { return !r.ok; });
    let msg = data.message || "批量导入完成";
    if (failed.length) msg += "；失败 " + failed.length + " 个：" + failed.map(function(r) { return r.filename + (r.error ? "(" + r.error + ")" : ""); }).join("、");
    showOk(msg);
    $("tplFile").value = "";
    $("filePathBox").textContent = "未选择文件";
    $("fileCount").textContent = "";
    activePage = 1;
    loadTemplates();
  } catch (e) {
    showAlert("批量导入失败：" + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "批量导入全部所选";
  }
});



// ── 编辑器可用性（决定模板是否出现在编辑器「更换模板」面板） ──
// 注意：与 is_vip 无关。editable=0 的模板仍在首页模板中心展示与下载，
// 只是不进编辑器。用于把不适配热区编辑的模板从编辑器侧收敛掉。
async function setEditableFlag(id, editable) {
  hideAlert();
  const actionName = editable ? "允许在编辑器中使用" : "从编辑器模板库移除";
  if (!confirm("确认将模板 #" + id + " " + actionName + "？")) return;
  try {
    const fd = new FormData();
    fd.append("editable", String(editable));
    const resp = await adminFetch("/admin/templates/" + id + "/editable", { method: "POST", body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.error || "操作失败");
    showOk(data.message || "操作成功");
    loadTemplates();
  } catch (e) {
    showAlert("操作失败：" + e.message);
  }
}

async function batchSetEditable(editable) {
  hideAlert();
  const ids = Array.prototype.slice.call(document.querySelectorAll('.tpl-chk[data-group="active"]:checked'))
    .map(function(c) { return c.getAttribute("data-tpl"); });
  if (!ids.length) { showAlert("请先勾选模板"); return; }
  const actionName = editable ? "允许在编辑器中使用" : "从编辑器模板库移除";
  if (!confirm("确认将所选 " + ids.length + " 套模板" + actionName + "？")) return;
  try {
    const fd = new FormData();
    fd.append("editable", String(editable));
    fd.append("ids", ids.join(","));
    const resp = await adminFetch("/admin/templates/editable/batch", { method: "POST", body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.error || "操作失败");
    showOk(data.message || "操作成功");
    loadTemplates();
  } catch (e) {
    showAlert("操作失败：" + e.message);
  }
}

// ── 模板列表 ──
async function loadTemplates() {
  const box = $("tplList");
  try {
    const resp = await adminFetch("/admin/templates/list");
    const data = await resp.json();
    if (!resp.ok) throw new Error("加载失败");
    const list = data.templates || [];
    window.__ADMIN_TPLS__ = list;
    if (!list.length) {
      box.innerHTML = '<div class="empty">暂无模板，上传第一个模板吧</div>';
      return;
    }
    const pending = list.filter(function(t) { return t.review_status === "pending"; });
    const allActive = list.filter(function(t) { return t.review_status === "approved" && t.is_active == 1; });
    const freeActive = allActive.filter(function(t) { return !t.is_vip; }).sort(function(a, b) { return (a.display_id || 0) - (b.display_id || 0); });
    const rejected = list.filter(function(t) { return t.review_status === "rejected"; });
    let html = "";
    if (pending.length) {
      html += '<div class="card-title" style="color:var(--warn)">待人工审核（' + pending.length + '）</div>';
      html += '<div style="margin-bottom:8px;display:flex;align-items:center;gap:8px">'
        + '<label style="font-size:12px;cursor:pointer"><input type="checkbox" id="selAllPending" style="margin-right:4px">全选</label>'
        + '<span style="font-size:12px;color:var(--ink-3)">已选 <b id="selCountPending">0</b> 套</span>'
        + '<button class="btn" style="background:var(--success);padding:4px 14px;font-size:12px" id="batchApproveBtn" disabled>批量通过上架</button>'
        + '</div>';
      html += pending.map(renderReviewRow).join("");
    }
    if (freeActive.length) {
      const totalPages = Math.max(1, Math.ceil(freeActive.length / ACTIVE_PAGE_SIZE));
      if (activePage > totalPages) activePage = totalPages;
      const startIdx = (activePage - 1) * ACTIVE_PAGE_SIZE;
      const pageItems = freeActive.slice(startIdx, startIdx + ACTIVE_PAGE_SIZE);
      html += '<div class="card-title">免费模板（' + freeActive.length + '）</div>';
      html += '<div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        + '<label style="font-size:12px;cursor:pointer"><input type="checkbox" id="selAllActive" style="margin-right:4px">全选</label>'
        + '<span style="font-size:12px;color:var(--ink-3)">已选 <b id="selCountActive">0</b> 套</span>'
        + '<button class="btn" id="batchEditableOnBtn" disabled style="background:var(--success-soft);color:var(--success);padding:4px 14px;font-size:12px">允许编辑器使用</button>'
        + '<button class="btn" id="batchEditableOffBtn" disabled style="background:var(--paper-deep);color:var(--ink-2);padding:4px 14px;font-size:12px">移出编辑器</button>'
        + '<button class="btn btn-danger" id="batchDelBtn" disabled style="padding:4px 14px;font-size:12px">批量删除所选</button>'
        + '</div>'
        + '<table><thead><tr><th style="width:32px"></th><th>序号</th><th>名称</th><th>编辑器</th><th>操作</th></tr></thead><tbody>'
        + pageItems.map(function(t, idx) {
          const ed = (t.editable === undefined || t.editable === null) ? 1 : Number(t.editable);
          return '<tr>'
            + '<td><input type="checkbox" class="tpl-chk" data-tpl="' + t.id + '" data-group="active"></td>'
            + '<td class="num" title="库内 ID ' + t.id + '">' + (startIdx + idx + 1) + '</td>'
            + '<td><b>' + t.name + '</b><br><span style="color:var(--ink-3);font-size:12px">' + (t.description || "") + '</span></td>'
            + '<td><button class="btn btn-mini" style="background:' + (ed ? 'var(--success-soft);color:var(--success)' : 'var(--paper-deep);color:#6B7280') + '" '
            + 'title="点击切换：是否出现在编辑器的「更换模板」面板" '
            + 'onclick="setEditableFlag(' + t.id + ',' + (ed ? 0 : 1) + ')">' + (ed ? '可用' : '已隐藏') + '</button></td>'
            + '<td><div class="ops">'
            + '<a class="btn btn-mini" style="text-decoration:none;display:inline-block" href="/static/template-editor.html?id=' + t.id + '" target="_blank" title="可视化调整模板布局、增删文本框">自由编辑</a>'
            + '<button class="btn btn-danger" onclick="delTemplate(' + t.id + ')">删除</button></div></td>'
            + '</tr>';
        }).join("") + '</tbody></table>';
      if (totalPages > 1) {
        html += '<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px">'
          + '<button class="btn btn-mini" id="activePrev" ' + (activePage <= 1 ? "disabled" : "") + '>‹ 上一页</button>'
          + '<span style="font-size:12px;color:var(--ink-2)">第 ' + activePage + ' / ' + totalPages + ' 页</span>'
          + '<button class="btn btn-mini" id="activeNext" ' + (activePage >= totalPages ? "disabled" : "") + '>下一页 ›</button>'
          + '</div>';
      }
    }
    if (rejected.length) {
      html += '<div class="card-title" style="color:var(--ink-3)">已拒绝（' + rejected.length + '）</div>';
      html += rejected.map(function(t) {
        return '<div style="padding:8px 12px;border:1px solid #eee;border-radius:8px;margin-bottom:8px;font-size:13px">'
          + '<b>' + t.name + '</b> <span style="color:var(--ink-3)">(id=' + t.id + ')</span> '
          + '<button class="btn btn-mini" onclick="reviewTemplate(' + t.id + ',\'approve\')">重新通过</button></div>';
      }).join("");
    }
    box.innerHTML = html;
    bindBatchUI();
  } catch (e) {
    box.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
  }
}

function renderReviewRow(t) {
  let report = {};
  try { report = JSON.parse(t.validation_report || "{}"); } catch (e) {}
  const checks = (report.render_checks || []).map(function(c) {
    return '<div style="font-size:12px;margin:2px 0">' + (c.ok ? "✓" : "×") + " " + c.name
      + ' <span style="color:var(--ink-3)">' + (c.detail || "") + '</span></div>';
  }).join("");
  const warns = [];
  if (report.missing_placeholders && report.missing_placeholders.length) {
    warns.push("缺少占位符：" + report.missing_placeholders.join("、"));
  }
  if (report.unknown_placeholders && report.unknown_placeholders.length) {
    warns.push("未配置占位符：" + report.unknown_placeholders.join("、"));
  }
  return '<div style="border:1px solid #D9B36A;background:#FFFBF0;border-radius:10px;padding:12px 14px;margin-bottom:10px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
    + '<div><label style="cursor:pointer"><input type="checkbox" class="tpl-chk" data-tpl="' + t.id + '" data-group="pending" style="margin-right:6px">'
    + '<b>' + t.name + '</b></label> <span style="color:var(--ink-3);font-size:12px">(id=' + t.id + ')</span></div>'
    + '<div class="ops">'
    + '<button class="btn" style="background:var(--success)" onclick="reviewTemplate(' + t.id + ',\'approve\')">通过上架</button>'
    + '<button class="btn btn-danger" onclick="reviewTemplate(' + t.id + ',\'reject\')">✕ 拒绝</button>'
    + '</div></div>'
    + '<div style="font-size:12px;color:var(--ink-2);margin-top:8px">' + (t.description || "") + '</div>'
    + (warns.length ? '<div style="font-size:12px;color:var(--warn);margin-top:6px">※ ' + warns.join("；") + '</div>' : "")
    + (checks ? '<div style="margin-top:6px">' + checks + '</div>' : '<div style="font-size:12px;color:var(--ink-3);margin-top:6px">未运行渲染体检</div>')
    + '</div>';
}

async function reviewTemplate(id, action) {
  hideAlert();
  if (action === "approve" && !confirm("确认通过该模板并上架？")) return;
  if (action === "reject" && !confirm("确认拒绝该模板？")) return;
  try {
    const fd = new FormData();
    fd.append("action", action);
    const resp = await adminFetch("/admin/templates/" + id + "/review", { method: "POST", body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.error || "操作失败");
    showOk(data.message || "操作成功");
    activePage = 1;
    loadTemplates();
  } catch (e) {
    showAlert("操作失败：" + e.message);
  }
}

async function delTemplate(id) {
  if (!confirm("确认删除该模板？")) return;
  hideAlert();
  try {
    const resp = await adminFetch("/admin/templates/" + id, { method: "DELETE" });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.error || "删除失败");
    showOk("模板已删除");
    activePage = 1;
    loadTemplates();
    } catch (e) {
    showAlert("删除失败：" + e.message);
  }
}

// ── 批量操作 ──
function bindBatchUI() {
  const chks = document.querySelectorAll(".tpl-chk");
  chks.forEach(function(chk) {
    chk.addEventListener("change", updateBatchBar);
  });
  const selAllActive = $("selAllActive");
  if (selAllActive) {
    selAllActive.addEventListener("change", function() {
      document.querySelectorAll('.tpl-chk[data-group="active"]').forEach(function(c) {
        c.checked = selAllActive.checked;
      });
      updateBatchBar();
    });
  }
  const selAllPending = $("selAllPending");
  if (selAllPending) {
    selAllPending.addEventListener("change", function() {
      document.querySelectorAll('.tpl-chk[data-group="pending"]').forEach(function(c) {
        c.checked = selAllPending.checked;
      });
      updateBatchBar();
    });
  }
  const delBtn = $("batchDelBtn");
  if (delBtn) delBtn.addEventListener("click", batchDelete);
  const edOn = $("batchEditableOnBtn");
  if (edOn) edOn.addEventListener("click", function() { batchSetEditable(1); });
  const edOff = $("batchEditableOffBtn");
  if (edOff) edOff.addEventListener("click", function() { batchSetEditable(0); });
  const apprBtn = $("batchApproveBtn");
  if (apprBtn) apprBtn.addEventListener("click", batchApprove);
  // 已上架分页
  const prevBtn = $("activePrev");
  if (prevBtn) {
    prevBtn.addEventListener("click", function() {
      if (activePage > 1) { activePage--; loadTemplates(); }
    });
  }
  const nextBtn = $("activeNext");
  if (nextBtn) {
    nextBtn.addEventListener("click", function() {
      activePage++; loadTemplates();
    });
  }
}

function selectedIds(group) {
  return Array.from(document.querySelectorAll('.tpl-chk[data-group="' + group + '"]:checked'))
    .map(function(c) { return c.dataset.tpl; });
}

function updateBatchBar() {
  const a = selectedIds("active");
  const p = selectedIds("pending");
  const cA = $("selCountActive");
  const cP = $("selCountPending");
  const dA = $("batchDelBtn");
  const dP = $("batchApproveBtn");
  if (cA) cA.textContent = a.length;
  if (cP) cP.textContent = p.length;
  if (dA) dA.disabled = a.length === 0;
  if (dP) dP.disabled = p.length === 0;
  const edOn = $("batchEditableOnBtn");
  const edOff = $("batchEditableOffBtn");
  if (edOn) edOn.disabled = a.length === 0;
  if (edOff) edOff.disabled = a.length === 0;
}

async function batchDelete() {
  const ids = selectedIds("active");
  if (!ids.length) return;
  if (!confirm("确认批量删除选中的 " + ids.length + " 套模板？删除后列表将按 ID 重新排序。")) return;
  hideAlert();
  try {
    const fd = new FormData();
    fd.append("action", "delete");
    fd.append("ids", ids.join(","));
    const resp = await adminFetch("/admin/templates/batch", { method: "POST", body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.error || "批量删除失败");
    showOk(data.message || "批量删除成功");
    activePage = 1;
    loadTemplates();
  } catch (e) {
    showAlert("批量删除失败：" + e.message);
  }
}

async function batchApprove() {
  const ids = selectedIds("pending");
  if (!ids.length) return;
  if (!confirm("确认批量通过选中的 " + ids.length + " 套模板并上架？")) return;
  hideAlert();
  try {
    const fd = new FormData();
    fd.append("action", "approve");
    fd.append("ids", ids.join(","));
    const resp = await adminFetch("/admin/templates/batch", { method: "POST", body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || data.error || "批量操作失败");
    showOk(data.message || "批量操作成功");
    activePage = 1;
    loadTemplates();
  } catch (e) {
    showAlert("批量操作失败：" + e.message);
  }
}

// 已登录直接进入；未登录跳转管理员登录页
if (adminToken) enterAdmin();
else requireAdminLogin();
</script>
</body>
</html>

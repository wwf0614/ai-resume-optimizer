<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI智简历 - 登录</title>
<link rel="stylesheet" href="/static/css/app.css?v=20261004c">
<style>
  html, body { height: 100%; }
  body { position: relative; overflow: hidden; }

  .login-layout { display: flex; width: 100%; min-height: 100vh; }

  /* ── 左侧品牌区：一张摊开的"扉页" ── */
  .brand-side {
    flex: 1.05; display: flex; flex-direction: column; justify-content: center;
    padding: 44px 56px 56px; border-right: 1px solid var(--line);
    background:
      linear-gradient(var(--paper), var(--paper)) padding-box,
      repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(28,25,23,.035) 31px, rgba(28,25,23,.035) 32px);
  }
  .brand { display: flex; align-items: center; gap: 14px; align-self: center; }
  .brand-mark {
    width: 54px; height: 54px; border-radius: 10px;
    background: var(--accent-grad); display: flex; align-items: center; justify-content: center;
    color: #FAF9F6; box-shadow: var(--shadow-paper);
  }
  .brand-mark svg { width: 28px; height: 28px; }
  .brand-name { font-family: var(--serif); font-size: 40px; font-weight: 700; letter-spacing: 2px; color: var(--ink); }

  .brand-body { margin-top: 38px; width: 100%; text-align: center; }
  .brand-body h1 {
    font-size: 38px; font-weight: 700; line-height: 1.42; letter-spacing: .04em; color: var(--ink);
  }
  .brand-body p { margin-top: 16px; font-size: 14px; color: var(--ink-2); line-height: 1.9; }

  .feats { max-width: 400px; margin: 34px auto 0; border-top: 1px solid var(--line); padding-top: 24px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
  .feat { display: flex; align-items: flex-start; gap: 11px; color: var(--ink-2); font-size: 13.5px; line-height: 1.7; text-align: left; }
  .feat svg { width: 17px; height: 17px; color: var(--accent); margin-top: 3px; flex: none; }
  .feat b { color: var(--ink); font-weight: 600; }

  /* ── 右侧登录卡：一张竖放的纸 ── */
  .form-side { flex: .95; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .login-card {
    width: 420px; max-width: 100%;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 40px 38px 34px;
    box-shadow: var(--shadow-pop);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .login-card { animation: rise .4s ease both; }

  .card-brand { display: flex; align-items: center; gap: 10px; }
  .card-brand .brand-mark { width: 38px; height: 38px; }
  .card-brand .brand-mark svg { width: 20px; height: 20px; }
  .card-brand .brand-name { font-size: 20px; }

  .panel-title { font-size: 24px; margin-top: 26px; }
  .panel-sub { color: var(--ink-2); font-size: 13px; margin-top: 8px; line-height: 1.7; }

  .form { margin-top: 24px; }
  .field { margin-bottom: 16px; }
  .field-label { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; margin-bottom: 7px; }
  .forgot { color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; }
  .forgot:hover { color: var(--accent-strong); text-decoration: underline; }

  .input { height: 44px; }

  .pw-box { position: relative; }
  .pw-box .input { padding-right: 46px; }
  .pw-eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border: none; background: transparent;
    color: var(--ink-3); cursor: pointer; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center; transition: color .15s, background-color .15s;
  }
  .pw-eye:hover { color: var(--accent); background: var(--accent-soft); }
  .pw-eye svg { width: 18px; height: 18px; }
  .pw-eye .i-off { display: none; }
  .pw-eye.revealed .i-on { display: none; }
  .pw-eye.revealed .i-off { display: block; }

  .btn-login {
    width: 100%; height: 46px; letter-spacing: 6px; text-indent: 6px;
    font-size: 15px; margin-top: 4px;
  }

  .switch-line { text-align: center; color: var(--ink-2); font-size: 13px; margin-top: 22px; }
  .switch-line a { font-weight: 700; cursor: pointer; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ── 忘记密码弹窗 ── */
  .mask { z-index: 50; }
  .modal { width: 360px; max-width: 100%; padding: 26px 26px 22px; }
  .modal h3 { font-size: 16px; }
  .modal p { color: var(--ink-2); font-size: 13px; line-height: 1.8; margin-top: 10px; }
  .modal .btn-primary { margin-top: 18px; width: 100%; height: 42px; }

  /* ── 响应式 ── */
  @media (max-width: 900px) {
    body { overflow: auto; }
    .login-layout { flex-direction: column; }
    .brand-side { display: none; }
    .form-side { flex: 1; padding: 40px 20px; }
  }
  @media (max-height: 720px) and (min-width: 901px) {
    body { overflow: auto; }
  }
</style>
</head>
<body>
  <div class="login-layout">
    <!-- 左侧：品牌扉页 -->
    <div class="brand-side">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.9 6.3.5-4.8 4.1 1.5 6.2L12 16.3l-5.4 3.4 1.5-6.2-4.8-4.1 6.3-.5z"/></svg>
        </div>
        <div class="brand-name">AI智简历</div>
      </div>
      <div class="brand-body">
        <h1>让每一份简历<br>都被认真看见</h1>
        <p>上传旧简历，AI 拆解并重写经历与自我评价；<br>选一套模板，版式与内容从此各行其道。</p>
        <div class="feats">
          <div class="feat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.8 4.8L18.5 10l-4.7 1.2L12 16l-1.8-4.8L5.5 10l4.7-1.2z"/></svg>
            <span><b>AI 深度优化</b> · 岗位 JD 拆解，经历量化改写</span>
          </div>
          <div class="feat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
            <span><b>精选模板</b> · 排版规范，内容与版式完全分离</span>
          </div>
          <div class="feat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/></svg>
            <span><b>一键导出</b> · Word / PDF 随取随用</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：登录卡片 -->
    <div class="form-side">
      <div class="login-card">
        <div class="card-brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.9 6.3.5-4.8 4.1 1.5 6.2L12 16.3l-5.4 3.4 1.5-6.2-4.8-4.1 6.3-.5z"/></svg>
          </div>
          <div class="brand-name">AI智简历</div>
        </div>

        <!-- 登录 -->
        <div class="panel active" id="panelLogin">
          <h1 class="panel-title">账号登录</h1>
          <p class="panel-sub">登录后使用 AI 优化、模板选择与简历导出</p>
          <form class="form" id="loginForm" novalidate>
            <div class="form-error" id="loginError"></div>
            <div class="field">
              <div class="field-label"><label for="loginAccount">手机号/邮箱</label></div>
              <input class="input" id="loginAccount" type="text" placeholder="手机号/邮箱" autocomplete="username">
            </div>
            <div class="field">
              <div class="field-label">
                <label for="loginPwd">密码</label>
                <a class="forgot" id="forgotBtn">忘记密码？</a>
              </div>
              <div class="pw-box">
                <input class="input" id="loginPwd" type="password" placeholder="请输入密码" autocomplete="current-password">
                <button type="button" class="pw-eye" data-target="loginPwd" title="显示/隐藏密码" aria-label="显示或隐藏密码">
                  <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
                </button>
              </div>
            </div>
            <button class="btn-login btn-primary" id="loginBtn" type="submit">登录</button>
          </form>
          <div class="switch-line">还没有账号？<a id="toRegister">立即注册</a></div>
        </div>

        <!-- 注册 -->
        <div class="panel" id="panelRegister">
          <h1 class="panel-title">创建账号</h1>
          <p class="panel-sub">注册后可保存优化记录，随时下载你的专属简历</p>
          <form class="form" id="registerForm" novalidate>
            <div class="form-error" id="registerError"></div>
            <div class="field">
              <div class="field-label"><label for="regAccount">手机号/邮箱</label></div>
              <input class="input" id="regAccount" type="text" placeholder="手机号/邮箱" autocomplete="username">
            </div>
            <div class="field">
              <div class="field-label"><label for="regNick">昵称（选填）</label></div>
              <input class="input" id="regNick" type="text" placeholder="你的昵称" autocomplete="nickname">
            </div>
            <div class="field">
              <div class="field-label"><label for="regPwd">密码</label></div>
              <div class="pw-box">
                <input class="input" id="regPwd" type="password" placeholder="至少 6 位" autocomplete="new-password">
                <button type="button" class="pw-eye" data-target="regPwd" title="显示/隐藏密码" aria-label="显示或隐藏密码">
                  <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
                </button>
              </div>
            </div>
            <div class="field">
              <div class="field-label"><label for="regPwd2">确认密码</label></div>
              <div class="pw-box">
                <input class="input" id="regPwd2" type="password" placeholder="再次输入密码" autocomplete="new-password">
                <button type="button" class="pw-eye" data-target="regPwd2" title="显示/隐藏密码" aria-label="显示或隐藏密码">
                  <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>
                </button>
              </div>
            </div>
            <button class="btn-login btn-primary" id="registerBtn" type="submit">注册</button>
          </form>
          <div class="switch-line">已有账号？<a id="toLogin">立即登录</a></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 忘记密码 -->
  <div class="mask" id="forgotMask">
    <div class="modal">
      <h3>忘记密码</h3>
      <p>系统暂未开通自助找回。请提供注册时使用的手机号/邮箱，联系管理员协助重置密码。</p>
      <button class="btn-primary" id="forgotClose">我知道了</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = "resume_planet_token";
const USER_KEY = "resume_planet_user";

function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(function() { t.classList.remove("show"); }, 2600);
}

function setMode(mode) {
  $("panelLogin").classList.toggle("active", mode === "login");
  $("panelRegister").classList.toggle("active", mode === "register");
}

function showError(box, msg) {
  box.textContent = msg;
  box.classList.add("show");
}
function hideError(box) { box.classList.remove("show"); }

function markInput(input, ok) {
  input.classList.toggle("error", !ok);
  return ok;
}

const PHONE_RE = /^1\d{10}$/;
const EMAIL_RE = /^[\w.+-]+@[\w.-]+\.\w+$/;
function validAccount(s) { return PHONE_RE.test(s) || EMAIL_RE.test(s); }

async function api(path, body) {
  const resp = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await resp.json().catch(function() { return {}; });
  if (!resp.ok) throw new Error(data.detail || "请求失败，请稍后重试");
  return data;
}

function setAuth(token, user) {
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(USER_KEY, JSON.stringify(user));
}

function clearAuth() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
}

// ── 登录 ──
$("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  hideError($("loginError"));
  const account = $("loginAccount").value.trim().toLowerCase();
  const pwd = $("loginPwd").value;
  let ok = true;
  ok = markInput($("loginAccount"), account.length > 0) && ok;
  ok = markInput($("loginPwd"), pwd.length > 0) && ok;
  if (!ok) { showError($("loginError"), "请填写账号和密码"); return; }

  const btn = $("loginBtn");
  btn.disabled = true;
  btn.textContent = "登录中…";
  try {
    const data = await api("/api/login", { account: account, password: pwd });
    setAuth(data.token, data.user);
    showToast("欢迎回来，" + (data.user.nickname || account));
    setTimeout(function() { location.href = "/"; }, 350);
  } catch (err) {
    showError($("loginError"), err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "登录";
  }
});

// ── 注册 ──
$("registerForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  hideError($("registerError"));
  const account = $("regAccount").value.trim().toLowerCase();
  const nick = $("regNick").value.trim();
  const pwd = $("regPwd").value;
  const pwd2 = $("regPwd2").value;
  let ok = true;
  ok = markInput($("regAccount"), account.length > 0) && ok;
  ok = markInput($("regPwd"), pwd.length > 0) && ok;
  ok = markInput($("regPwd2"), pwd2.length > 0) && ok;
  if (!ok) { showError($("registerError"), "请完整填写注册信息"); return; }
  if (!validAccount(account)) {
    showError($("registerError"), "请输入正确的手机号或邮箱");
    markInput($("regAccount"), false);
    return;
  }
  if (pwd.length < 6) {
    showError($("registerError"), "密码至少 6 位");
    markInput($("regPwd"), false);
    return;
  }
  if (pwd !== pwd2) {
    showError($("registerError"), "两次输入的密码不一致");
    markInput($("regPwd2"), false);
    return;
  }

  const btn = $("registerBtn");
  btn.disabled = true;
  btn.textContent = "注册中…";
  try {
    const data = await api("/api/register", { account: account, nickname: nick, password: pwd });
    setAuth(data.token, data.user);
    showToast("注册成功，正在进入…");
    setTimeout(function() { location.href = "/"; }, 400);
  } catch (err) {
    showError($("registerError"), err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "注册";
  }
});

// ── 切换登录/注册 ──
$("toRegister").addEventListener("click", function() {
  hideError($("loginError"));
  setMode("register");
});
$("toLogin").addEventListener("click", function() {
  hideError($("registerError"));
  setMode("login");
});

// ── 忘记密码 ──
$("forgotBtn").addEventListener("click", function() { $("forgotMask").classList.add("show"); });
$("forgotClose").addEventListener("click", function() { $("forgotMask").classList.remove("show"); });
$("forgotMask").addEventListener("click", function(e) {
  if (e.target === this) this.classList.remove("show");
});

// ── 密码可见性切换 ──
document.querySelectorAll(".pw-eye").forEach(function(btn) {
  btn.addEventListener("click", function() {
    const input = $(btn.dataset.target);
    if (!input) return;
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.classList.toggle("revealed", show);
  });
});

// ── 已登录则直接进入 ──
(function() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return;
  fetch("/api/me", { headers: { Authorization: "Bearer " + token }, cache: "no-store" })
    .then(function(resp) {
      if (resp.ok) {
        location.replace("/");
      } else {
        clearAuth();
      }
    })
    .catch(function() {});
})();

// ── URL 直达注册面板（/login?mode=register）──
(function() {
  const params = new URLSearchParams(location.search);
  if (params.get("mode") === "register") setMode("register");
})();
</script>
</body>
</html>

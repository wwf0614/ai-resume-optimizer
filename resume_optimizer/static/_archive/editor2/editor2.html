<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历编辑（新版） - 简历星球</title>
<link rel="stylesheet" href="/static/editor.css?v=20260830a">
<link rel="stylesheet" href="/static/editor2.css?v=20260830a">
</head>
<body class="rt2-body">

<!-- ─── 顶部工具栏 ─── -->
<header class="ed-toolbar">
  <div class="ed-toolbar-left">
    <a href="/" class="ed-logo" title="返回首页">
      <svg class="ed-logo-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#5B5CFF"/><stop offset="100%" style="stop-color:#9B59B6"/></linearGradient></defs>
        <rect width="40" height="40" rx="10" fill="url(#starGrad)"/>
        <path d="M20 7.5l4.2 8.5 9.4 1.4-6.8 6.6 1.6 9.3L20 28.2l-8.4 4.4 1.6-9.3-6.8-6.6 9.4-1.4z" fill="#fff"/>
      </svg>
      <span class="ed-logo-name">简历星球<small>新版编辑</small></span>
    </a>
    <a href="/my-resumes" class="ed-btn ed-btn-back"><span class="ed-back-arrow">←</span><span>我的简历</span></a>
    <button class="ed-btn ed-btn-soft" id="classicBtn" title="切换到经典版编辑器"><span>经典版</span></button>
  </div>

  <div class="ed-toolbar-center">
    <div class="ed-tb-group" role="toolbar" aria-label="编辑工具">
      <button class="ed-tb-btn" id="tplBtn" title="更换模板（已填内容自动跟随）"><span class="ed-tb-ico">🔄</span><span>更换模板</span></button>
      <button class="ed-tb-btn" id="photoBtn" title="替换模板中的照片"><span class="ed-tb-ico">📷</span><span>替换照片</span></button>
    </div>
  </div>

  <div class="ed-toolbar-right">
    <button class="ed-btn ed-btn-soft" id="saveBtn" title="保存草稿"><span>💾</span><span>保存</span></button>
    <div class="ed-dropdown">
      <button class="ed-btn ed-btn-download" id="exportBtn"><span>📥导出</span><span class="ed-caret">▼</span></button>
      <div class="ed-dropdown-menu" id="exportMenu" hidden>
        <button data-fmt="docx">📄 导出 Word（模板原生）</button>
        <button data-fmt="pdf">📕 导出 PDF</button>
        <button data-fmt="png">🖼️ 导出长图</button>
      </div>
    </div>
    <div class="ed-user-avatar" id="userAvatar"><span class="avatar-placeholder">👤</span></div>
  </div>
</header>

<!-- ─── 主体：左侧画布 + 右侧板块导航 ─── -->
<main class="ed-main rt2-main">
  <section class="ed-preview-wrap" id="previewWrap">
    <div class="rp-paper rt2-paper" id="paper">
      <div class="rt2-loading" id="rt2Loading"><div class="ed-spinner"></div><p>正在解析模板（首次约需 10-30 秒）…</p></div>
    </div>
  </section>

  <aside class="ed-panel">
    <div class="ed-panel-tabs">
      <button class="ed-tab active" data-tab="nav">板块导航</button>
      <button class="ed-tab" data-tab="tips">使用说明</button>
    </div>
    <div class="ed-panel-body">
      <div class="ed-tab-pane active" id="tab-nav">
        <p class="ed-panel-hint">点击板块名可定位到简历对应区域；在简历上<b>直接点击文字即可编辑</b>，选中文字可加粗、改字号颜色。</p>
        <div class="rt2-nav" id="navList"></div>
      </div>
      <div class="ed-tab-pane" id="tab-tips">
        <div class="ed-panel-hint">
          <b>直接编辑：</b>点击简历上的文字出现光标，像 Word 一样直接输入。<br><br>
          <b>改格式：</b>选中一段文字，会弹出格式工具栏（加粗/字号/颜色/对齐/行距/项目符号）。<br><br>
          <b>换模板：</b>已填的内容自动带入新模板。<br><br>
          <b>导出：</b>Word 为模板原生格式，可直接投递；PDF/长图与模板设计一致。
        </div>
      </div>
    </div>
    <div class="ed-panel-footer"><div class="ed-panel-avatar"><span class="avatar-placeholder">👤</span></div></div>
  </aside>
</main>

<!-- ─── 浮动格式工具栏 ─── -->
<div class="rt2-fmt" id="fmtBar" hidden>
  <button data-cmd="bold" title="加粗"><b>B</b></button>
  <button data-cmd="italic" title="斜体"><i>I</i></button>
  <button data-cmd="underline" title="下划线"><u>U</u></button>
  <span class="rt2-fmt-sep"></span>
  <select id="fmtSize" title="字号">
    <option value="">字号</option>
    <option value="9">9</option><option value="10">10</option><option value="10.5">10.5</option>
    <option value="11">11</option><option value="12">12</option><option value="14">14</option>
    <option value="16">16</option><option value="18">18</option><option value="22">22</option>
  </select>
  <label class="rt2-color-btn" title="文字颜色">
    🎨<input type="color" id="fmtColor" value="#333333">
  </label>
  <span class="rt2-fmt-sep"></span>
  <button data-cmd="justifyLeft" title="左对齐">⬅</button>
  <button data-cmd="justifyCenter" title="居中">↔</button>
  <button data-cmd="justifyRight" title="右对齐">➡</button>
  <span class="rt2-fmt-sep"></span>
  <button data-cmd="insertUnorderedList" title="项目符号">•≡</button>
  <select id="fmtLine" title="行距">
    <option value="">行距</option>
    <option value="1">1.0</option><option value="1.3">1.3</option>
    <option value="1.6">1.6</option><option value="2">2.0</option>
  </select>
  <button data-cmd="removeFormat" title="清除格式">✕</button>
  <span class="rt2-fmt-sep"></span>
  <button data-cmd="undo" title="撤销 (Ctrl+Z)">↶</button>
  <button data-cmd="redo" title="重做 (Ctrl+Y)">↷</button>
</div>

<!-- ─── 更换模板弹窗 ─── -->
<div class="ed-modal-mask" id="tplModal" hidden>
  <div class="ed-modal wide">
    <div class="ed-modal-head"><h3>更换模板（已填内容自动跟随）</h3><button class="ed-modal-close" data-close-tpl>&times;</button></div>
    <div class="ed-modal-body"><div class="ed-tpl-grid" id="tplGrid"></div></div>
    <div class="ed-modal-foot"><button class="ed-btn ed-btn-soft" data-close-tpl>关闭</button></div>
  </div>
</div>

<!-- ─── 通用 toast / loading ─── -->
<div class="ed-loading-mask" id="loadingMask" hidden>
  <div class="ed-loading-card"><div class="ed-spinner"></div><p id="loadingText">处理中…</p></div>
</div>
<div class="ed-toast" id="toast" hidden></div>
<input type="file" id="photoInput" accept="image/*" hidden>

<script src="/static/editor2.js?v=20260830l"></script>
</body>
</html>

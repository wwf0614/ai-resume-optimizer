<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的简历 - AI智简历</title>
<link rel="stylesheet" href="/static/css/app.css?v=20261004c">
<style>
  body { display: flex; }

  /* ── 左侧栏：竖排"书脊" ── */
  .sidebar {
    width: var(--sidebar-w, 210px); min-width: var(--sidebar-w, 210px);
    background: var(--card);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
    padding: 24px 14px 20px;
  }
  .sb-user { text-align: center; padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .sb-avatar {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 26px; font-weight: 700; font-family: var(--serif);
    display: flex; align-items: center; justify-content: center;
  }
  .sb-name {
    font-size: 15px; font-weight: 600; color: var(--ink); max-width: 160px;
    margin: 0 auto 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sb-id { font-size: 11.5px; color: var(--ink-3); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  .btn-vip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--vip-soft); color: var(--vip); border: 1px solid #E2D5B4;
    border-radius: var(--r-md); padding: 7px 18px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background-color .15s; font-family: inherit;
  }
  .btn-vip:hover { background: #EFE5C9; }
  .btn-vip svg { width: 14px; height: 14px; }

  /* 左侧菜单 */
  .sb-menu { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sb-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 13px;
    border-radius: var(--r-md); font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background-color .15s, color .15s; text-decoration: none; color: var(--ink-2);
    border: none; background: none; width: 100%; font-family: inherit;
  }
  .sb-item:hover { background: var(--accent-soft); color: var(--accent); }
  .sb-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
  .sb-icon { width: 18px; height: 18px; flex-shrink: 0; }
  .sb-icon svg { width: 18px; height: 18px; display: block; }

  /* ── 主内容区 ── */
  .main { flex: 1; margin-left: var(--sidebar-w, 210px); padding: 28px 32px 40px; min-height: 100vh; }
  .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .page-head-left, .page-head-right { display: flex; align-items: center; gap: 14px; }
  .page-title { font-size: 21px; color: var(--ink); }
  .page-title span { color: var(--ink-3); font-size: 15px; font-weight: 400; font-family: var(--sans); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .batch-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .batch-toggle[hidden], .btn-batch-del[hidden], .batch-count[hidden] { display: none !important; }
  .batch-toggle input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .batch-count { font-size: 13px; color: var(--accent); font-weight: 600; }
  .btn-batch-del { padding: 8px 16px; font-size: 13px; }
  .btn-new { padding: 9px 18px; font-size: 13.5px; }

  /* ── 简历卡片：一叠纸 ── */
  .resume-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .resume-card {
    background: var(--card); border-radius: var(--r-lg);
    border: 1px solid var(--line); overflow: hidden; position: relative;
    cursor: default; transition: box-shadow .15s, border-color .15s;
  }
  .resume-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-pop); }
  .resume-card.batch-mode .rc-checkbox-wrap { opacity: 1; pointer-events: auto; }
  .rc-checkbox-wrap {
    position: absolute; top: 10px; left: 10px; z-index: 11;
    width: 24px; height: 24px; background: #fff; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(28,25,23,.2); opacity: 0; pointer-events: none;
    transition: opacity .15s; border: 1px solid var(--line);
  }
  .resume-card:hover .rc-checkbox-wrap { opacity: 1; pointer-events: auto; }
  .rc-checkbox { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .rc-preview {
    width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top;
    background: var(--paper-deep); display: block; border-bottom: 1px solid var(--line);
  }
  .rc-fallback { display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
  .rc-fallback svg { width: 44px; height: 44px; }
  .rc-body { padding: 10px 13px 12px; }
  .rc-name { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .rc-time { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-tag { display: inline-block; padding: 1px 7px; border-radius: var(--r-sm); font-size: 10.5px; font-weight: 600; background: var(--paper-deep); color: var(--ink-2); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 悬停操作层 */
  .rc-overlay {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(28,25,23,.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .resume-card:hover .rc-overlay { opacity: 1; pointer-events: auto; }
  .btn-edit-overlay {
    background: var(--accent); color: #FAF9F6; border: none; border-radius: var(--r-md);
    padding: 9px 30px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-color .15s; font-family: inherit;
  }
  .btn-edit-overlay:hover { background: var(--accent-strong); }
  .btn-del-overlay {
    background: transparent; color: rgba(250,249,246,.88); border: none;
    font-size: 13px; cursor: pointer; padding: 4px 14px; font-family: inherit;
  }
  .btn-del-overlay:hover { color: #fff; text-decoration: underline; }

  /* 空状态 */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; margin: 8px auto; max-width: 460px; padding: 52px 30px; color: var(--ink-2);
    background: #FDFCFA; border: 1px dashed var(--line-strong); border-radius: var(--r-lg);
    cursor: pointer; transition: border-color .15s;
  }
  .empty-state:hover { border-color: var(--accent); }
  .empty-icon { color: var(--ink-3); margin-bottom: 14px; }
  .empty-icon svg { width: 46px; height: 46px; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .empty-desc { font-size: 13.5px; margin-bottom: 22px; }
  .empty-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: #FAF9F6; border: none; border-radius: var(--r-md);
    padding: 10px 24px; font-size: 14px; font-weight: 600;
    pointer-events: none;
  }

  /* 加载骨架屏 */
  .skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .skeleton-card { background: var(--card); border-radius: var(--r-lg); border: 1px solid var(--line); overflow: hidden; }
  .sk-preview { width: 100%; aspect-ratio: 3 / 4; }
  .sk-body { padding: 12px 13px; }
  .sk-line { height: 13px; border-radius: 4px; margin-bottom: 7px; }
  .sk-line.short { width: 60%; }
  .sk-line.tiny { width: 40%; height: 10px; }

  /* 删除确认弹窗 */
  .del-box { padding: 28px 30px; width: 380px; max-width: 90vw; text-align: center; }
  .del-icon { color: var(--danger); margin-bottom: 10px; }
  .del-icon svg { width: 36px; height: 36px; }
  .del-title { font-size: 17px; color: var(--ink); margin-bottom: 6px; }
  .del-desc { font-size: 13px; color: var(--ink-2); margin-bottom: 22px; line-height: 1.6; }
  .del-btns { display: flex; gap: 10px; justify-content: center; }
  .btn-cancel { flex: 1; padding: 9px; border: 1px solid var(--line-strong); background: #fff; border-radius: var(--r-md); font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; font-family: inherit; transition: background-color .15s; }
  .btn-cancel:hover { background: var(--paper-deep); }
  .btn-confirm-del { flex: 1; padding: 9px; border: none; background: var(--danger); border-radius: var(--r-md); font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; font-family: inherit; transition: background-color .15s; }
  .btn-confirm-del:hover { background: #9A2D25; }

  /* 响应式 */
  @media (max-width: 900px) {
    .resume-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .main { padding: 20px 16px 30px; }
  }
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .main { margin-left: 0; }
    .resume-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  }
</style>
</head>
<body>

<!-- 左侧栏 -->
<aside class="sidebar" id="sidebar">
  <div class="sb-user">
    <div class="sb-avatar" id="sbAvatar">?</div>
    <div class="sb-name" id="sbName">加载中...</div>
    <div class="sb-id" id="sbId">ID: --</div>
    <button class="btn-vip" onclick="showToast('会员功能即将上线，敬请期待')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.5 11h-15z"/></svg>
      开通会员
    </button>
  </div>
  <nav class="sb-menu">
    <a class="sb-item active" href="/static/my-resumes.html">
      <span class="sb-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h4"/></svg></span>我的简历
    </a>
    <a class="sb-item" href="/static/editor.html" target="_blank" title="新建/编辑简历">
      <span class="sb-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 0 1 4 4L8 20l-5 1 1-5z"/></svg></span>新建简历
    </a>
    <a class="sb-item" href="#" onclick="showToast('订单管理功能即将上线');return false;">

    </a>
    <a class="sb-item" href="/" title="返回首页">
      <span class="sb-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span>返回首页
    </a>

</aside>

<!-- 主内容 -->
<main class="main" id="mainArea">
  <div class="page-head">
    <div class="page-head-left">
      <h1 class="page-title">简历列表<span id="draftCount">(0)</span></h1>
      <label class="batch-toggle" id="batchToggle" hidden>
        <input type="checkbox" id="selectAllCb">

  <!-- 骨架屏 -->
  <div class="skeleton-grid" id="skeletonGrid">
    <div class="skeleton-card"><div class="sk-preview"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line tiny"></div></div></div>
    <div class="skeleton-card"><div class="sk-preview"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line tiny"></div></div></div>
    <div class="skeleton-card"><div class="sk-preview"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line tiny"></div></div></div>
  </div>

  <!-- 卡片网格 -->
  <div class="resume-grid" id="resumeGrid" style="display:none;"></div>

  <!-- 空状态 -->

    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>
    </div>
    <div class="empty-title">还没有简历</div>
    <div class="empty-desc">点击创建你的第一份 AI 智能简历</div>
    <span class="empty-link">＋ 立即创建</span>
  </div>
</main>

<!-- 删除确认弹窗 -->
<div class="del-modal" id="delModal">
  <div class="del-box">
    <div class="del-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </div>
    <div class="del-title" id="delTitle">确认删除该简历？</div>
    <div class="del-desc" id="delDesc">删除后无法恢复，请确认操作。</div>
    <div class="del-btns">
      <button class="btn-cancel" onclick="closeDelModal()">取消</button>
      <button class="btn-confirm-del" id="confirmDelBtn">确认删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   我的简历 · 简历列表页
   ═══════════════════════════════════════════ */

const $ = id => document.getElementById(id);

// ── 认证工具（与 index.html 一致）──
const TOKEN_KEY = 'resume_planet_token';
const USER_KEY = 'resume_planet_user';
function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function authHeaders(h) {
  const o = Object.assign({}, h || {});
  const t = getToken();
  if (t) o['Authorization'] = 'Bearer ' + t;
  return o;
}
function clearAuth() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
}
function authUrl(url) {
  const t = getToken();
  if (!t) return url;
  return url + (url.indexOf('?') > -1 ? '&' : '?') + 'token=' + encodeURIComponent(t);
}

let currentUser = null;
let draftList = [];
let templateMap = {};       // template_id → template info (含 preview_url)
let pendingDeleteId = null;
let pendingDeleteBatch = [];
let selectedIds = new Set();
let batchMode = false;      // 是否进入批量选择模式（hover 即显示复选框）

// ── Toast ──
let toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ── 时间格式化 ──
function timeAgo(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    const now = new Date();
    const diff = Math.floor((now - d) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    if (diff < 604800) return Math.floor(diff / 86400) + ' 天前';
    return d.toLocaleDateString('zh-CN');
  } catch(e) { return ''; }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 初始化：校验登录态 ──
async function init() {
  const t = getToken();
  if (!t) { location.href = '/login'; return; }

  try {
    const resp = await fetch('/api/me', { headers: authHeaders(), cache: 'no-store' });
    if (!resp.ok) { clearAuth(); location.href = '/login'; return; }
    currentUser = await resp.json();
    localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
    applyUserInfo(currentUser);
  } catch(e) { clearAuth(); location.href = '/login'; return; }

  // 并行加载草稿列表和模板信息
  await Promise.all([loadTemplates(), loadDrafts()]);
}

function applyUserInfo(user) {
  const name = user.nickname || user.account || '用户';
  $('sbName').textContent = name;
  $('sbAvatar').textContent = name.trim().charAt(0).toUpperCase();
  $('sbId').textContent = 'ID: ' + (user.id || '--');
}

// ── 加载模板映射（用于卡片缩略图）：免费 + VIP 模板都要加载 ──
async function loadTemplates() {
  try {
    const freeResp = await fetch('/templates', { headers: authHeaders(), cache: 'no-store' }).catch(() => null);
    if (freeResp && freeResp.ok) {
      const list = await freeResp.json();
      list.forEach(t => { templateMap[t.id] = t; });
    }
  } catch(e) { /* 静默 */ }
}

// ── 加载草稿列表 ──
async function loadDrafts() {
  // 隐藏骨架屏
  $('skeletonGrid').style.display = 'none';

  try {
    const resp = await fetch('/api/draft/list', { headers: authHeaders(), cache: 'no-store' });
    if (resp.status === 401) { clearAuth(); location.href = '/login'; return; }
    if (!resp.ok) throw new Error('加载失败');

    draftList = await resp.json();
    renderCards();
  } catch(e) {
    $('resumeGrid').style.display = 'none';
    $('emptyState').style.display = 'flex';
    $('emptyState').querySelector('.empty-title').textContent = '加载失败';
    $('emptyState').querySelector('.empty-desc').textContent = e.message + '，请刷新重试';
    const emptyLink = $('emptyState').querySelector('.empty-link');
    if (emptyLink) emptyLink.style.display = 'none';
  }
}

// ── 渲染简历卡片 ──
function renderCards() {
  const grid = $('resumeGrid');
  const empty = $('emptyState');
  const countEl = $('draftCount');

  countEl.textContent = '(' + draftList.length + ')';

  if (!draftList.length) {
    grid.style.display = 'none';
    empty.style.display = 'flex';
    // 重置空状态为默认文案
    empty.querySelector('.empty-title').textContent = '还没有简历';
    empty.querySelector('.empty-desc').textContent = '点击创建你的第一份 AI 智能简历';
    const emptyLink = empty.querySelector('.empty-link');
    if (emptyLink) emptyLink.style.display = '';
    return;
  }

  empty.style.display = 'none';
  grid.style.display = 'grid';

  grid.innerHTML = draftList.map(d => {
    const tpl = templateMap[d.template_id];
    // 即使 templateMap 没加载到，也按 template_id 直接构造预览图 URL
    const fallbackUrl = d.template_id ? `/static/previews/t${d.template_id}.png?v=5` : '';
    const previewUrl = (tpl && tpl.preview_url) || fallbackUrl;
    const thumb = previewUrl
      ? `<img class="rc-preview" src="${escapeHtml(previewUrl)}" alt="${escapeHtml(d.title)}" loading="lazy" onerror="this.onerror=null;this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<div class=\\'rc-preview rc-fallback\\'><svg viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'1.4\\' stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\'><path d=\\'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\\'/><path d=\\'M14 3v6h6\\'/></svg></div>')">`
      : `<div class="rc-preview rc-fallback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg></div>`;
    const tplName = tpl ? tpl.name : (d.template_id ? `模板 #${d.template_id}` : '默认模板');
    const timeStr = timeAgo(d.updated_at);

    return `<div class="resume-card" data-id="${d.id}">
      <label class="rc-checkbox-wrap" title="选中以批量删除">
        <input type="checkbox" class="rc-checkbox" data-cb-id="${d.id}" ${selectedIds.has(d.id) ? 'checked' : ''}>
      </label>
      ${thumb}
      <div class="rc-body">
        <div class="rc-name">${escapeHtml(d.title)}</div>
        <div class="rc-meta">
          <span class="rc-tag">${escapeHtml(tplName)}</span>
          <span class="rc-time">${timeStr}</span>
        </div>
      </div>
      <div class="rc-overlay">
        <button class="btn-edit-overlay" data-edit-id="${d.id}">在线编辑</button>
        <button class="btn-del-overlay" data-del-id="${d.id}" data-del-title="${escapeHtml(d.title)}">删除</button>
      </div>
    </div>`;
  }).join('');

  // 绑定事件
  grid.querySelectorAll('.btn-edit-overlay').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openEditor(parseInt(btn.dataset.editId, 10));
    });
  });

  grid.querySelectorAll('.btn-del-overlay').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openDelModal(parseInt(btn.dataset.delId, 10), btn.dataset.delTitle);
    });
  });

  // 批量选择：卡片上任意非按钮区域点击即切换选择状态
  grid.querySelectorAll('.resume-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.rc-overlay') || e.target.closest('.rc-checkbox-wrap')) return;
      if (!batchMode) { enterBatchMode(); }
      const id = parseInt(card.dataset.id, 10);
      const cb = card.querySelector('.rc-checkbox');
      toggleSelect(id, !selectedIds.has(id));
      if (cb) cb.checked = selectedIds.has(id);
    });
  });

  grid.querySelectorAll('.rc-checkbox').forEach(cb => {
    cb.addEventListener('change', e => {
      e.stopPropagation();
      const id = parseInt(cb.dataset.cbId, 10);
      toggleSelect(id, cb.checked);
    });
  });
}

// ── 批量选择模式 ──
function enterBatchMode() {
  batchMode = true;
  document.querySelectorAll('.resume-card').forEach(c => c.classList.add('batch-mode'));
  $('batchToggle').hidden = false;
  updateBatchUI();
}

function exitBatchMode() {
  batchMode = false;
  selectedIds.clear();
  document.querySelectorAll('.resume-card').forEach(c => c.classList.remove('batch-mode'));
  document.querySelectorAll('.rc-checkbox').forEach(cb => cb.checked = false);
  $('batchToggle').hidden = true;
  $('batchCount').hidden = true;
  $('batchDelBtn').hidden = true;
  $('selectAllCb').checked = false;
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  if (selectedIds.size === 0 && batchMode) {
    // 全部取消后保持批量模式，但隐藏工具栏
    updateBatchUI();
  } else if (selectedIds.size > 0 && !batchMode) {
    enterBatchMode();
  } else {
    updateBatchUI();
  }
}

function updateBatchUI() {
  const n = selectedIds.size;
  const total = draftList.length;
  $('batchCount').textContent = `已选 ${n} 项`;
  $('batchCount').hidden = n === 0;
  $('batchDelBtn').hidden = n === 0;
  $('selectAllCb').checked = n > 0 && n === total;
}

// ── 打开编辑器（带 draft_id）──
function openEditor(draftId) {
  const url = draftId
    ? '/static/editor.html?draft_id=' + encodeURIComponent(draftId)
    : '/static/editor.html';
  window.open(url, '_blank');
}

function createNew() { window.open('/static/editor.html', '_blank'); }

// ── 删除流程（单条 + 批量）──
function openDelModal(id, title) {
  pendingDeleteId = id;
  pendingDeleteBatch = [];
  $('delTitle').textContent = '确认删除该简历？';
  $('delDesc').textContent = `「${title}」将被永久删除，此操作不可撤销。`;
  $('delModal').classList.add('show');
}

function openBatchDelModal() {
  pendingDeleteId = null;
  pendingDeleteBatch = Array.from(selectedIds);
  const n = pendingDeleteBatch.length;
  $('delTitle').textContent = `确认删除这 ${n} 份简历？`;
  $('delDesc').textContent = '删除后无法恢复，请确认操作。';
  $('delModal').classList.add('show');
}

function closeDelModal() {
  $('delModal').classList.remove('show');
  pendingDeleteId = null;
  pendingDeleteBatch = [];
  // 重置按钮状态
  const btn = $('confirmDelBtn');
  btn.textContent = '确认删除';
  btn.disabled = false;
}

$('confirmDelBtn').addEventListener('click', async () => {
  const btn = $('confirmDelBtn');
  btn.textContent = '删除中…';
  btn.disabled = true;

  if (pendingDeleteBatch.length > 0) {
    await doBatchDelete(btn);
    return;
  }
  if (!pendingDeleteId) { closeDelModal(); return; }

  try {
    const resp = await fetch('/api/draft/' + pendingDeleteId, {
      method: 'DELETE',
      headers: authHeaders()
    });
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      const msg = typeof d.detail === 'string' ? d.detail
        : (d.detail ? JSON.stringify(d.detail) : ('请求失败 (' + resp.status + ')'));
      throw new Error(msg);
    }

    showToast('已删除');
    draftList = draftList.filter(d => d.id !== pendingDeleteId);
    renderCards();
    closeDelModal();
  } catch(e) {
    showToast('删除失败：' + e.message);
    btn.textContent = '确认删除';
    btn.disabled = false;
  }
});

async function doBatchDelete(btn) {
  try {
    const resp = await fetch('/api/draft/batch-delete', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ ids: pendingDeleteBatch })
    });
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      const msg = typeof d.detail === 'string' ? d.detail
        : (d.detail ? JSON.stringify(d.detail) : ('请求失败 (' + resp.status + ')'));
      throw new Error(msg);
    }
    const r = await resp.json();
    showToast(`已删除 ${r.deleted || pendingDeleteBatch.length} 份简历`);
    draftList = draftList.filter(d => !selectedIds.has(d.id));
    exitBatchMode();
    renderCards();
    closeDelModal();
  } catch(e) {
    showToast('批量删除失败：' + e.message);
    btn.textContent = '确认删除';
    btn.disabled = false;
  }
}

$('batchDelBtn').addEventListener('click', openBatchDelModal);

$('selectAllCb').addEventListener('change', e => {
  const checked = e.target.checked;
  document.querySelectorAll('.rc-checkbox').forEach(cb => {
    const id = parseInt(cb.dataset.cbId, 10);
    cb.checked = checked;
    if (checked) selectedIds.add(id); else selectedIds.delete(id);
  });
  if (!batchMode && selectedIds.size > 0) enterBatchMode();
  else updateBatchUI();
});

$('delModal').addEventListener('click', e => {
  if (e.target === $('delModal')) closeDelModal();
});

// 按 Esc 退出批量选择模式
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && batchMode) exitBatchMode();
});

// ── 启动 ──
init();
</script>
</body>
</html>
